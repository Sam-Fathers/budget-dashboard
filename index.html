<style>
  :root {

    --text-tertiary: #AEAEB2;

  html[data-theme="dark"] {

    --card: #1C1C1E;
    --text: #F5F5F7;

    --text-tertiary: #636366;
    --border: #2C2C2E;

    --green: #30D158;

  #app { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  .loading { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 14px; }

  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); }
  .hero { padding-top: 4px; margin-bottom: 24px; }

  .add-form { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }

  .add-btn { background: var(--text); color: var(--bg); border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }

  .nw-hero-value { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .nw-hero-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const COLORS = {
  'Housing': '#0071E3',
  'Transport': '#5E5CE6',
  'Debt Interest': '#FF3B30',
  'Food & Dining': '#FF9500',
  'Social & Entertainment': '#FF2D55',
  'Fitness & Health': '#34C759',
  'Subscriptions': '#AF52DE',
  'Utilities': '#64D2FF',
  'Family & Other': '#8E8E93',
};
const FALLBACK_PALETTE = ['#0071E3','#5E5CE6','#FF3B30','#FF9500','#FF2D55','#34C759','#AF52DE','#64D2FF','#8E8E93','#30B0C7'];

function colorFor(category) {
  if (COLORS[category]) return COLORS[category];
  let hash = 0;
  for (let i = 0; i < category.length; i++) hash = (hash * 31 + category.charCodeAt(i)) % FALLBACK_PALETTE.length;
  return FALLBACK_PALETTE[Math.abs(hash) % FALLBACK_PALETTE.length];
}
function safeId(name) { return String(name).replace(/[^a-zA-Z0-9]/g, ''); }

const DEFAULT_ITEMS = [
  { id: 1, name: 'Rent', category: 'Housing', monthly: 2080.00 },
  { id: 2, name: 'Personal Loan (Car)', category: 'Transport', monthly: 1083.33 },

async function withRetry(fn, retries = 1, delayMs = 700) {
  try {
    return await fn();

    await new Promise(r => setTimeout(r, delayMs));
    return withRetry(fn, retries - 1, delayMs);

}

async function getOrSeed(key, defaultVal) {
  if (!currentUser) return defaultVal;
  try {
    const { data, error } = await withRetry(() => supabaseClient.from('budget_kv').select('value').eq('key', key).eq('user_id', currentUser.id).maybeSingle());
    if (error) throw error;
    if (data && data.value !== null && data.value !== undefined) return data.value;
  } catch (e) {
    console.error('READ failed for "' + key + '": ' + errText(e));
    return defaultVal;
  }
  // No row yet for this key - seed it with the default.
  try {
    const { error } = await withRetry(() => supabaseClient.from('budget_kv').upsert({ key, value: defaultVal, user_id: currentUser.id }));
    if (error) throw error;
  } catch (e) {
    console.error('SEED failed for "' + key + '": ' + errText(e));
  }
  return defaultVal;
}
async function persist(key, value) {
  if (!currentUser) return;
  try {
    const { error } = await withRetry(() => supabaseClient.from('budget_kv').upsert({ key, value, user_id: currentUser.id, updated_at: new Date().toISOString() }));

  } catch (e) {
    console.error('SAVE failed for "' + key + '": ' + errText(e));
  }
}

function exportBackupJson() {

    netWorth: state.netWorth,

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'budget_backup_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);

// Writes a previously exported backup into Supabase. Only meaningful once this file is opened
// standalone (outside Claude), since it needs real network access to persist().
async function restoreFromBackupJson(jsonText) {
  const parsed = JSON.parse(jsonText);
  let map;
  if (Array.isArray(parsed)) {
    // Raw Supabase SQL Editor export: [{key: "budget:items", value: [...]}, ...]
    map = {};
    parsed.forEach(row => { if (row && row.key) map[row.key] = row.value; });
  } else {
    // This app's own "Download full backup" format: {items, income, salary, ...}
    map = {
      'budget:items': parsed.items, 'budget:income': parsed.income, 'budget:salary': parsed.salary,
      'budget:debts': parsed.debts, 'budget:theme': parsed.theme, 'budget:goal': parsed.goal,
      'budget:hasPrivateCover': parsed.hasPrivateCover, 'budget:netWorth': parsed.netWorth,
    };
  }
  let restoredCount = 0;
  for (const [key, value] of Object.entries(map)) {
    if (value !== undefined && value !== null) { await persist(key, value); restoredCount++; }
  }
  return restoredCount;
}

function buildConicGradient(cats, total) {
  if (total <= 0) return 'var(--chip-bg)';
  let cum = 0;
  const stops = cats.map(c => {

// Australian resident individual tax rates, 2026-27 income year (ato.gov.au/tax-rates-and-codes/tax-rates-australian-residents)
function incomeTax2026(taxableIncome) {
  const t = Math.max(taxableIncome, 0);
  if (t <= 18200) return 0;
  if (t <= 45000) return (t - 18200) * 0.15;
  if (t <= 135000) return 4020 + (t - 45000) * 0.30;
  if (t <= 190000) return 31020 + (t - 135000) * 0.37;
  return 51370 + (t - 190000) * 0.45;
}
const MEDICARE_LEVY_RATE = 0.02;
// Medicare Levy Surcharge, single income thresholds, 2026-27 (ato.gov.au/.../medicare-levy-surcharge-income-thresholds-and-rates)
function mlsRateFor(income) {
  if (income <= 105000) return 0;
  if (income <= 123000) return 0.01;
  if (income <= 164000) return 0.0125;
  return 0.015;
}
function computeAuTax(gross, hasCover) {
  const incomeTax = incomeTax2026(gross);
  const medicareLevy = gross * MEDICARE_LEVY_RATE;
  const rate = hasCover ? 0 : mlsRateFor(gross);
  const mls = gross * rate;
  const totalTax = incomeTax + medicareLevy + mls;
  const netAnnual = gross - totalTax;
  return { incomeTax, medicareLevy, mls, mlsRatePct: rate * 100, totalTax, netAnnual, netMonthly: netAnnual / 12, netWeekly: netAnnual / 52, effectiveRatePct: gross ? (totalTax / gross) * 100 : 0 };
}

function parseCsvLine(line) {
  const result = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; } }
      else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { result.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  result.push(cur);
  return result.map(s => s.trim());
}
function parseImportText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const items = [];
  let skipped = 0;
  lines.forEach(line => {
    const fields = parseCsvLine(line);
    if (fields.length < 2) { skipped++; return; }
    if (['item', 'name'].includes(fields[0].toLowerCase())) return;
    let name, category, monthlyStr;
    if (fields.length >= 3) { name = fields[0]; category = fields[1]; monthlyStr = fields[2]; }
    else { name = fields[0]; category = 'Family & Other'; monthlyStr = fields[1]; }
    const monthly = parseFloat(String(monthlyStr).replace(/[^0-9.\-]/g, ''));
    if (!name || isNaN(monthly)) { skipped++; return; }
    items.push({ name, category: category || 'Family & Other', monthly });
  });
  return { items, skipped };
}

function monthsToPayoff(balance, aprPct, payment) {
  if (!balance || balance <= 0) return { months: 0, totalInterest: 0, coversInterest: true };
  if (!payment || payment <= 0) return { months: Infinity, totalInterest: Infinity, coversInterest: false };
  const r = (aprPct || 0) / 100 / 12;
  const monthlyInterest = balance * r;
  if (payment <= monthlyInterest) return { months: Infinity, totalInterest: Infinity, coversInterest: false };
  if (r === 0) {
    const months = Math.ceil(balance / payment);
    return { months, totalInterest: 0, coversInterest: true };
  }
  const months = Math.log(payment / (payment - balance * r)) / Math.log(1 + r);
  const monthsCeil = Math.ceil(months);
  const totalInterest = Math.max(0, payment * monthsCeil - balance);
  return { months: monthsCeil, totalInterest, coversInterest: true };
}

function projectGoalText(monthlyContribution) {
  const need = Math.max((state.goal.target || 0) - (state.goal.current || 0), 0);
  if (need <= 0) return 'Goal already reached';
  if (monthlyContribution <= 0) return 'Not currently saving — adjust your budget to reach this goal';
  const months = Math.ceil(need / monthlyContribution);
  const d = new Date();
  d.setMonth(d.getMonth() + months);
  return months + ' month' + (months === 1 ? '' : 's') + ' (~' + d.toLocaleDateString('en-AU', { month: 'short', year: 'numeric' }) + ')';
}
function goalMonthsRemaining(monthlyContribution) {
  const need = Math.max((state.goal.target || 0) - (state.goal.current || 0), 0);
  if (need <= 0 || monthlyContribution <= 0) return null;
  return Math.ceil(need / monthlyContribution);
}

function lineChartSvg(points, opts) {
  opts = opts || {};

  const maxVal = opts.max || Math.max(...points, 1);
  const n = points.length;
  const xStep = (W - PAD * 2) / Math.max(n - 1, 1);
  const coords = points.map((v, i) => ({ x: PAD + i * xStep, y: H - PADB - ((v / maxVal) * (H - PADB - PAD)) }));
  const linePath = coords.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const areaPath = `${linePath} L ${coords[coords.length - 1].x.toFixed(1)} ${H - PADB} L ${coords[0].x.toFixed(1)} ${H - PADB} Z`;
  const dots = (opts.dots ? [coords[0], coords[coords.length - 1]] : []).map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--blue)"></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-bottom:8px;">
    <path d="${areaPath}" fill="var(--blue)" opacity="0.12"></path>
    <path d="${linePath}" fill="none" stroke="var(--blue)" stroke-width="2"></path>
    ${dots}
    <text x="${PAD}" y="${H - 4}" font-size="10" fill="var(--text-secondary)">${opts.startLabel || ''}</text>
    <text x="${W - PAD}" y="${H - 4}" font-size="10" fill="var(--text-secondary)" text-anchor="end">${opts.endLabel || ''}</text>
  </svg>`;
}
function debtPayoffSvg(balance, aprPct, payment, months) {
  const r = (aprPct || 0) / 100 / 12;

  let bal = balance;
  for (let m = 1; m <= months; m++) {
    bal = Math.max(0, bal + bal * r - payment);
    points.push(bal);
  }
  return lineChartSvg(points, { max: balance, dots: true, startLabel: 'Today', endLabel: months + ' mo' });
}
function goalProjectionSvg(current, target, monthlyContribution) {
  const months = goalMonthsRemaining(monthlyContribution);
  if (months === null) return '';
  return lineChartSvg([current, target], { max: target, dots: true, startLabel: 'Today', endLabel: '~' + months + ' mo' });
}

function computeSimulatedTotals(catsMonthly) {
  let simExpenses = 0;
  catsMonthly.forEach(c => { const mult = (simState[c.name] ?? 100) / 100; simExpenses += c.value * mult; });
  const simRemaining = state.income.monthly - simExpenses;
  const simRate = state.income.monthly ? (simRemaining / state.income.monthly) * 100 : 0;
  return { simExpenses, simRemaining, simRate, simYearly: simRemaining * 12 };
}
function updateSimulationOutputs() {
  const catsMonthly = categoryTotals('monthly');
  const sim = computeSimulatedTotals(catsMonthly);
  const baseline = computeTotals();
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  set('sim-expenses', fmt(sim.simExpenses, 2));
  set('sim-remaining', fmt(sim.simRemaining, 2));
  set('sim-rate', sim.simRate.toFixed(1) + '%');
  set('sim-yearly', fmt(sim.simYearly, 0));
  set('sim-goal-date', projectGoalText(sim.simRemaining));
  const remEl = document.getElementById('sim-remaining');
  if (remEl) remEl.style.color = sim.simRemaining >= baseline.remainingMonthly ? 'var(--green)' : 'var(--red)';
  set('compare-sim-val', fmt(sim.simExpenses, 0));
  const simBar = document.getElementById('compare-sim-bar');
  if (simBar) {
    simBar.style.width = Math.min((sim.simExpenses / (baseline.expensesMonthly || 1)) * 100, 200) + '%';
    simBar.style.background = sim.simExpenses > baseline.expensesMonthly ? 'var(--red)' : 'var(--blue)';
  }
  catsMonthly.forEach(c => {
    const mult = (simState[c.name] ?? 100) / 100;
    set('sim-cat-' + safeId(c.name), fmt(c.value * mult, 0));
    set('sim-cat-pct-' + safeId(c.name), (simState[c.name] ?? 100) + '%');
  });
}

function exportCsv() {
  const rows = [['Item', 'Category', 'Monthly', 'Weekly']];
  state.items.forEach(i => rows.push([i.name, i.category, i.monthly.toFixed(2), weeklyOf(i.monthly).toFixed(2)]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'budget_export_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function sortedFilteredItems() {
  let list = state.items.filter(i => {
    const matchCat = ui.category === 'All' || i.category === ui.category;
    const matchSearch = i.name.toLowerCase().includes(ui.search.toLowerCase());
    return matchCat && matchSearch;
  });
  list.sort((a, b) => {
    let av, bv;
    if (ui.sortKey === 'name' || ui.sortKey === 'category') { av = a[ui.sortKey]; bv = b[ui.sortKey]; }
    else { av = ui.mode === 'monthly' ? a.monthly : weeklyOf(a.monthly); bv = ui.mode === 'monthly' ? b.monthly : weeklyOf(b.monthly); }
    if (typeof av === 'string') return ui.sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return ui.sortDir === 'asc' ? av - bv : bv - av;
  });
  return list;
}

function animateHero(newVal) {
  const el = document.getElementById('hero-value-num');
  if (!el) return;
  const start = lastHeroValue === null ? newVal : lastHeroValue;
  const startTime = performance.now();
  const duration = 500;
  function step(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const current = start + (newVal - start) * eased;
    el.textContent = fmt(current, 2);
    if (t < 1) requestAnimationFrame(step);
    else lastHeroValue = newVal;
  }
  requestAnimationFrame(step);
}

        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input type="text" id="search-input" placeholder="Search items" value="${escapeHtml(ui.search)}">
        </div>
        <button class="export-btn" id="import-toggle-btn">Import</button>
        <button class="export-btn" id="export-csv-btn">Export CSV</button>
      </div>
      ${ui.importOpen ? `
      <div class="import-box">
        <textarea id="import-textarea" rows="5" placeholder="Paste rows as: Name, Category, Monthly $&#10;e.g. Rent, Housing, 2080&#10;(also accepts CSV exported from this dashboard)"></textarea>
        <div class="import-actions">
          <button class="add-btn" id="import-add-btn">Add items</button>
          <button class="export-btn" id="import-replace-btn">Replace all</button>
          <button class="reset-link" id="import-cancel-btn">Cancel</button>
        </div>
      </div>` : ''}
      <div class="chips">
        ${['All', ...cats.map(c => c.name)].map(c => `<button class="chip ${ui.category === c ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
      </div>
      <table>
        <thead>
          <tr>
            <th data-sort="name">Item${sortArrow('name')}</th>
            <th data-sort="category">Category${sortArrow('category')}</th>
            <th class="right" data-sort="monthly">${ui.mode === 'monthly' ? 'Monthly' : 'Weekly'}${sortArrow('monthly')}</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${items.map(item => `
            <tr>
              <td>
                ${ui.editingNameId === item.id
                  ? `<input class="name-input" id="item-name-edit-input" type="text" value="${escapeHtml(item.name)}">`
                  : `<span class="name-edit" data-edit-name-id="${item.id}">${escapeHtml(item.name)}</span>`}
              </td>
              <td>
                <span class="cat-dot" style="background:${colorFor(item.category)}"></span><span class="cat-label">${escapeHtml(item.category)}</span>${item.freq === 'weekly' ? '<span class="freq-tag">wk</span>' : ''}
                ${ui.editingDueDayId === item.id
                  ? `<input class="due-day-input" id="due-day-edit-input" type="number" min="1" max="31" value="${item.dueDay || ''}">`
                  : `<span class="due-day-tag" data-due-day-id="${item.id}">${item.dueDay ? 'day ' + item.dueDay : '+ due day'}</span>`}
              </td>
              <td class="right">
                ${ui.editingItemId === item.id
                  ? `<span class="amt-edit-wrap">
                      <input class="amt-input" id="item-edit-input" type="number" step="0.01" value="${toDisplayAmount(item.monthly, ui.editingItemFreq).toFixed(2)}">
                      <button type="button" class="freq-toggle" id="item-edit-freq-btn" data-freq="${ui.editingItemFreq}">${ui.editingItemFreq === 'weekly' ? '/wk' : '/mo'}</button>
                     </span>`
                  : `<span class="amt-edit" data-edit-id="${item.id}">${fmt(ui.mode === 'monthly' ? item.monthly : weeklyOf(item.monthly), ui.mode === 'monthly' ? 2 : 0)}</span>`}
              </td>
              <td class="right"><button class="del-btn" data-del-id="${item.id}">✕</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
      ${items.length === 0 ? '<div class="empty">No items match your filters.</div>' : ''}

      <form class="add-form" id="add-item-form">
        <input type="text" id="new-item-name" placeholder="Item name" required>
        <input type="text" id="new-item-category" placeholder="Category" list="cat-list" required>
        <div class="add-amount-wrap">
          <input type="number" id="new-item-monthly" placeholder="Amount" step="0.01" required>
          <button type="button" class="freq-toggle" id="new-item-freq-btn" data-freq="${ui.newItemFreq}">${ui.newItemFreq === 'weekly' ? '/wk' : '/mo'}</button>
        </div>
        <button type="submit" class="add-btn">Add</button>
      </form>
      <div style="margin-top:8px;">
        <input type="number" id="new-item-dueday" placeholder="Due day (optional, 1–31)" min="1" max="31" style="font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);width:100%;">
      </div>
      <datalist id="cat-list">
        ${Object.keys(COLORS).map(c => `<option value="${c}">`).join('')}
      </datalist>
    </div>

    <div class="footer-note">
      Your data is saved to your own Supabase database.<br>
      <button class="reset-link" id="export-backup-btn">Download full backup (JSON)</button>
      &nbsp;·&nbsp;
      <button class="reset-link" id="restore-backup-btn">Restore from backup</button>
      <input type="file" id="restore-file-input" accept="application/json" style="display:none">
      <br>
      <button class="reset-link" id="reset-btn">Reset to original spreadsheet data</button>
    </div>
  `;

  attachListeners();
  requestAnimationFrame(() => {
    document.querySelectorAll('.animated-bar').forEach(el => { el.style.width = el.dataset.width + '%'; });
  });
  animateHero(totals.remainingMonthly);
}

function attachListeners() {
  const app = document.getElementById('app');

  app.querySelectorAll('[data-cover-choice]').forEach(btn => {
    btn.addEventListener('click', async () => {
      state.hasPrivateCover = btn.dataset.coverChoice === 'true';
      persist('budget:hasPrivateCover', state.hasPrivateCover);
      render();
    });
  });
  const applyIncomeBtn = document.getElementById('apply-calculated-income-btn');
  if (applyIncomeBtn) {
    applyIncomeBtn.addEventListener('click', async () => {
      const auTax = computeAuTax(state.salary, state.hasPrivateCover);
      state.income.monthly = Math.round(auTax.netMonthly * 100) / 100;
      persist('budget:income', state.income);
      render();
    });
  }

  app.querySelectorAll('[data-theme-choice]').forEach(btn => {
    btn.addEventListener('click', async () => {
      state.theme = btn.dataset.themeChoice;
      document.documentElement.setAttribute('data-theme', state.theme);
      persist('budget:theme', state.theme);
      render();
    });
  });
  const signOutBtn = document.getElementById('sign-out-btn');
  if (signOutBtn) signOutBtn.addEventListener('click', handleSignOut);

  app.querySelectorAll('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => { ui.mode = btn.dataset.mode; render(); });
  });

  app.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => { ui.category = btn.dataset.cat; render(); });
  });

  app.querySelectorAll('[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (ui.sortKey === key) ui.sortDir = ui.sortDir === 'asc' ? 'desc' : 'asc';
      else { ui.sortKey = key; ui.sortDir = 'desc'; }
      render();
    });
  });

  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => { ui.search = e.target.value; ui.focusSearch = true; render(); });
    if (ui.focusSearch) {
      searchInput.focus();
      searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
      ui.focusSearch = false;
    }
  }

  const exportBtn = document.getElementById('export-csv-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportCsv);

  const importToggleBtn = document.getElementById('import-toggle-btn');
  if (importToggleBtn) importToggleBtn.addEventListener('click', () => { ui.importOpen = !ui.importOpen; render(); });
  const importCancelBtn = document.getElementById('import-cancel-btn');
  if (importCancelBtn) importCancelBtn.addEventListener('click', () => { ui.importOpen = false; render(); });
  const importAddBtn = document.getElementById('import-add-btn');
  if (importAddBtn) {
    importAddBtn.addEventListener('click', async () => {
      const ta = document.getElementById('import-textarea');
      const { items: parsed, skipped } = parseImportText(ta.value);
      if (parsed.length === 0) { alert("No valid rows found. Use: Name, Category, Amount per line."); return; }
      parsed.forEach(p => state.items.push({ id: ui.nextId++, name: p.name, category: p.category, monthly: p.monthly }));
      persist('budget:items', state.items);
      ui.importOpen = false;
      render();
      if (skipped > 0) alert(`Added ${parsed.length} item(s). Skipped ${skipped} row(s) that couldn't be read.`);
    });
  }
  const importReplaceBtn = document.getElementById('import-replace-btn');
  if (importReplaceBtn) {
    importReplaceBtn.addEventListener('click', async () => {
      const ta = document.getElementById('import-textarea');
      const { items: parsed, skipped } = parseImportText(ta.value);
      if (parsed.length === 0) { alert("No valid rows found. Use: Name, Category, Amount per line."); return; }
      if (!confirm(`Replace all ${state.items.length} current items with ${parsed.length} imported item(s)? This can't be undone.`)) return;
      state.items = parsed.map(p => ({ id: ui.nextId++, name: p.name, category: p.category, monthly: p.monthly }));
      state.debts = {};
      persist('budget:items', state.items);
      persist('budget:debts', state.debts);
      ui.importOpen = false;
      render();
      if (skipped > 0) alert(`Imported ${parsed.length} item(s). Skipped ${skipped} row(s) that couldn't be read.`);
    });
  }

  app.querySelectorAll('[data-del-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = Number(btn.dataset.delId);
      const deletedItem = state.items.find(i => i.id === id);
      state.items = state.items.filter(i => i.id !== id);
      delete state.debts[id];
      persist('budget:items', state.items);
      persist('budget:debts', state.debts);
      render();
      if (deletedItem) showUndoToast(deletedItem);
    });
  });

  app.querySelectorAll('[data-edit-id]').forEach(span => {
    span.addEventListener('click', () => {
      const id = Number(span.dataset.editId);
      const item = state.items.find(i => i.id === id);
      ui.editingItemId = id;
      ui.editingItemFreq = (item && item.freq === 'weekly') ? 'weekly' : 'monthly';
      render();
      const input = document.getElementById('item-edit-input');
      if (input) { input.focus(); input.select(); }
    });
  });
  const itemFreqBtn = document.getElementById('item-edit-freq-btn');
  if (itemFreqBtn) {
    // Prevent the button from stealing focus, so the input never blurs (and never
    // auto-commits) when switching units mid-edit.
    itemFreqBtn.addEventListener('mousedown', (e) => e.preventDefault());
    itemFreqBtn.addEventListener('click', () => {
      const input = document.getElementById('item-edit-input');
      if (!input) return;
      const curVal = parseFloat(input.value);
      const newFreq = ui.editingItemFreq === 'weekly' ? 'monthly' : 'weekly';
      if (!isNaN(curVal)) {
        const monthly = fromDisplayAmount(curVal, ui.editingItemFreq);
        input.value = toDisplayAmount(monthly, newFreq).toFixed(2);
      }
      ui.editingItemFreq = newFreq;
      itemFreqBtn.textContent = newFreq === 'weekly' ? '/wk' : '/mo';
      itemFreqBtn.dataset.freq = newFreq;
      input.focus();
    });
  }
  const itemEditInput = document.getElementById('item-edit-input');
  if (itemEditInput) {
    const commit = async () => {
      const val = parseFloat(itemEditInput.value);
      if (!isNaN(val) && val >= 0) {
        const item = state.items.find(i => i.id === ui.editingItemId);
        if (item) { item.monthly = fromDisplayAmount(val, ui.editingItemFreq); item.freq = ui.editingItemFreq; }
        persist('budget:items', state.items);
      }
      ui.editingItemId = null;
      render();
    };
    itemEditInput.addEventListener('blur', commit);
    itemEditInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') itemEditInput.blur();
      if (e.key === 'Escape') { ui.editingItemId = null; render(); }
    });
  }

  app.querySelectorAll('[data-edit-name-id]').forEach(span => {
    span.addEventListener('click', () => {
      ui.editingNameId = Number(span.dataset.editNameId);
      render();
      const input = document.getElementById('item-name-edit-input');
      if (input) { input.focus(); input.select(); }
    });
  });
  const nameEditInput = document.getElementById('item-name-edit-input');
  if (nameEditInput) {
    const commitName = async () => {
      const val = nameEditInput.value.trim();
      if (val) {
        const item = state.items.find(i => i.id === ui.editingNameId);
        if (item) item.name = val;
        persist('budget:items', state.items);
      }
      ui.editingNameId = null;
      render();
    };
    nameEditInput.addEventListener('blur', commitName);
    nameEditInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') nameEditInput.blur();
      if (e.key === 'Escape') { ui.editingNameId = null; render(); }
    });
  }

  const incomeValue = document.getElementById('income-value');
  if (incomeValue) incomeValue.addEventListener('click', () => { ui.editingIncome = true; render(); const inp = document.getElementById('income-input'); if (inp) { inp.focus(); inp.select(); } });
  const incomeInput = document.getElementById('income-input');
  if (incomeInput) {
    const commit = async () => {
      const val = parseFloat(incomeInput.value);
      if (!isNaN(val) && val >= 0) { state.income.monthly = val; persist('budget:income', state.income); }
      ui.editingIncome = false;
      render();
    };
    incomeInput.addEventListener('blur', commit);
    incomeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') incomeInput.blur(); if (e.key === 'Escape') { ui.editingIncome = false; render(); } });
  }

  const salaryValue = document.getElementById('salary-value');
  if (salaryValue) salaryValue.addEventListener('click', () => { ui.editingSalary = true; render(); const inp = document.getElementById('salary-input'); if (inp) { inp.focus(); inp.select(); } });
  const salaryInput = document.getElementById('salary-input');
  if (salaryInput) {
    const commit = async () => {
      const val = parseFloat(salaryInput.value);
      if (!isNaN(val) && val >= 0) { state.salary = val; persist('budget:salary', state.salary); }
      ui.editingSalary = false;
      render();
    };
    salaryInput.addEventListener('blur', commit);
    salaryInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') salaryInput.blur(); if (e.key === 'Escape') { ui.editingSalary = false; render(); } });
  }

  const goalNameValue = document.getElementById('goal-name-value');
  if (goalNameValue) goalNameValue.addEventListener('click', () => { ui.editingGoalField = 'name'; render(); const inp = document.getElementById('goal-name-input'); if (inp) { inp.focus(); inp.select(); } });
  const goalNameInput = document.getElementById('goal-name-input');
  if (goalNameInput) {
    const commit = async () => {
      const val = goalNameInput.value.trim();
      if (val) { state.goal.name = val; persist('budget:goal', state.goal); }
      ui.editingGoalField = null;
      render();
    };
    goalNameInput.addEventListener('blur', commit);
    goalNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') goalNameInput.blur(); if (e.key === 'Escape') { ui.editingGoalField = null; render(); } });
  }
  const goalCurrentValue = document.getElementById('goal-current-value');
  if (goalCurrentValue) goalCurrentValue.addEventListener('click', () => { ui.editingGoalField = 'current'; render(); const inp = document.getElementById('goal-current-input'); if (inp) { inp.focus(); inp.select(); } });
  const goalCurrentInput = document.getElementById('goal-current-input');
  if (goalCurrentInput) {
    const commit = async () => {
      const val = parseFloat(goalCurrentInput.value);
      if (!isNaN(val) && val >= 0) { state.goal.current = val; persist('budget:goal', state.goal); }
      ui.editingGoalField = null;
      render();
    };
    goalCurrentInput.addEventListener('blur', commit);
    goalCurrentInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') goalCurrentInput.blur(); if (e.key === 'Escape') { ui.editingGoalField = null; render(); } });
  }
  const goalTargetValue = document.getElementById('goal-target-value');
  if (goalTargetValue) goalTargetValue.addEventListener('click', () => { ui.editingGoalField = 'target'; render(); const inp = document.getElementById('goal-target-input'); if (inp) { inp.focus(); inp.select(); } });
  const goalTargetInput = document.getElementById('goal-target-input');
  if (goalTargetInput) {
    const commit = async () => {
      const val = parseFloat(goalTargetInput.value);
      if (!isNaN(val) && val > 0) { state.goal.target = val; persist('budget:goal', state.goal); }
      ui.editingGoalField = null;
      render();
    };
    goalTargetInput.addEventListener('blur', commit);
    goalTargetInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') goalTargetInput.blur(); if (e.key === 'Escape') { ui.editingGoalField = null; render(); } });
  }

  app.querySelectorAll('.sim-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      simState[slider.dataset.simCat] = Number(slider.value);
      updateSimulationOutputs();
    });
  });
  const resetSimBtn = document.getElementById('reset-sim-btn');
  if (resetSimBtn) resetSimBtn.addEventListener('click', () => { Object.keys(simState).forEach(k => simState[k] = 100); render(); });

  app.querySelectorAll('[data-debt-field]').forEach(inp => {
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); });
    if (inp.type === 'range') {
      inp.addEventListener('input', () => {
        const label = document.getElementById('debt-balance-val-' + inp.dataset.debtId);
        if (label) label.textContent = fmt(Number(inp.value), 0);
      });
    }
    inp.addEventListener('change', async () => {
      const id = Number(inp.dataset.debtId);
      const field = inp.dataset.debtField;
      const val = parseFloat(inp.value);
      const item = state.items.find(i => i.id === id);
      if (!state.debts[id]) state.debts[id] = { balance: DEFAULT_DEBT_BALANCE, apr: DEFAULT_DEBT_APR[id] || 0, payment: item ? item.monthly : 0 };
      state.debts[id][field] = isNaN(val) ? 0 : val;
      persist('budget:debts', state.debts);
      render();
    });
  });

  app.querySelectorAll('[data-nw-type]').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.nwType;
      ui.newNwType = type;
      document.querySelectorAll('[data-nw-type]').forEach(b => b.classList.toggle('active', b.dataset.nwType === type));
      const datalist = document.getElementById('nw-cat-list');
      if (datalist) {
        const cats = type === 'liability' ? LIABILITY_CATEGORIES : ASSET_CATEGORIES;
        datalist.innerHTML = cats.map(c => `<option value="${c}">`).join('');
      }
    });
  });
  const nwAddForm = document.getElementById('nw-add-form');
  if (nwAddForm) {
    nwAddForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('nw-name').value.trim();
      const category = document.getElementById('nw-category').value.trim() || 'Other';
      const value = parseFloat(document.getElementById('nw-value').value);
      if (!name || isNaN(value) || value < 0) return;
      const item = { id: ui.nextNwId++, name, category, value };
      if (ui.newNwType === 'liability') state.netWorth.liabilities.push(item);
      else state.netWorth.assets.push(item);
      persist('budget:netWorth', state.netWorth);
      render();
    });
  }
  app.querySelectorAll('[data-nw-edit-id]').forEach(span => {
    span.addEventListener('click', () => {
      ui.editingNetWorthId = Number(span.dataset.nwEditId);
      ui.editingNetWorthType = span.dataset.nwEditType;
      render();
      const inp = document.getElementById('nw-edit-input');
      if (inp) { inp.focus(); inp.select(); }
    });
  });
  const nwEditInput = document.getElementById('nw-edit-input');
  if (nwEditInput) {
    const commit = () => {
      const val = parseFloat(nwEditInput.value);
      if (!isNaN(val) && val >= 0) {
        const list = ui.editingNetWorthType === 'liability' ? state.netWorth.liabilities : state.netWorth.assets;
        const item = list.find(i => i.id === ui.editingNetWorthId);
        if (item) item.value = val;
        persist('budget:netWorth', state.netWorth);
      }
      ui.editingNetWorthId = null;
      ui.editingNetWorthType = null;
      render();
    };
    nwEditInput.addEventListener('blur', commit);
    nwEditInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') nwEditInput.blur();
      if (e.key === 'Escape') { ui.editingNetWorthId = null; ui.editingNetWorthType = null; render(); }
    });
  }
  app.querySelectorAll('[data-nw-del-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.nwDelId);
      const type = btn.dataset.nwDelType;
      if (type === 'liability') state.netWorth.liabilities = state.netWorth.liabilities.filter(i => i.id !== id);
      else state.netWorth.assets = state.netWorth.assets.filter(i => i.id !== id);
      persist('budget:netWorth', state.netWorth);
      render();
    });
  });

  const newItemFreqBtn = document.getElementById('new-item-freq-btn');
  if (newItemFreqBtn) {
    newItemFreqBtn.addEventListener('mousedown', (e) => e.preventDefault());
    newItemFreqBtn.addEventListener('click', () => {
      const input = document.getElementById('new-item-monthly');
      const newFreq = ui.newItemFreq === 'weekly' ? 'monthly' : 'weekly';
      if (input && input.value !== '') {
        const curVal = parseFloat(input.value);
        if (!isNaN(curVal)) {
          const monthly = fromDisplayAmount(curVal, ui.newItemFreq);
          input.value = toDisplayAmount(monthly, newFreq).toFixed(2);
        }
      }
      ui.newItemFreq = newFreq;
      newItemFreqBtn.textContent = newFreq === 'weekly' ? '/wk' : '/mo';
      newItemFreqBtn.dataset.freq = newFreq;
      if (input) input.focus();
    });
  }

  const addForm = document.getElementById('add-item-form');
  if (addForm) {
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('new-item-name').value.trim();
      const category = document.getElementById('new-item-category').value.trim() || 'Family & Other';
      const rawAmount = parseFloat(document.getElementById('new-item-monthly').value);
      if (!name || isNaN(rawAmount) || rawAmount < 0) return;
      const monthly = fromDisplayAmount(rawAmount, ui.newItemFreq);
      const dueDayRaw = parseInt(document.getElementById('new-item-dueday').value, 10);
      const dueDay = (!isNaN(dueDayRaw) && dueDayRaw >= 1 && dueDayRaw <= 31) ? dueDayRaw : null;
      const newItem = { id: ui.nextId++, name, category, monthly, freq: ui.newItemFreq };
      if (dueDay) newItem.dueDay = dueDay;
      state.items.push(newItem);
      ui.newItemFreq = 'monthly';
      persist('budget:items', state.items);
      render();
    });
  }

  app.querySelectorAll('[data-due-day-id]').forEach(tag => {
    tag.addEventListener('click', () => {
      ui.editingDueDayId = Number(tag.dataset.dueDayId);
      render();
      const inp = document.getElementById('due-day-edit-input');
      if (inp) { inp.focus(); inp.select(); }
    });
  });
  const dueDayInput = document.getElementById('due-day-edit-input');
  if (dueDayInput) {
    const commit = () => {
      const val = parseInt(dueDayInput.value, 10);
      const item = state.items.find(i => i.id === ui.editingDueDayId);
      if (item) {
        if (!isNaN(val) && val >= 1 && val <= 31) item.dueDay = val;
        else delete item.dueDay;
        persist('budget:items', state.items);
      }
      ui.editingDueDayId = null;
      render();
    };
    dueDayInput.addEventListener('blur', commit);
    dueDayInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') dueDayInput.blur();
      if (e.key === 'Escape') { ui.editingDueDayId = null; render(); }
    });
  }

  const exportBackupBtn = document.getElementById('export-backup-btn');
  if (exportBackupBtn) exportBackupBtn.addEventListener('click', exportBackupJson);

  const restoreBackupBtn = document.getElementById('restore-backup-btn');
  const restoreFileInput = document.getElementById('restore-file-input');
  if (restoreBackupBtn && restoreFileInput) {
    restoreBackupBtn.addEventListener('click', () => restoreFileInput.click());
    restoreFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        if (!confirm('Restore this backup? It will overwrite the data currently in your database.')) return;
        const count = await restoreFromBackupJson(text);
        if (count === 0) {
          alert("That file didn't contain any recognizable data — nothing was changed. Double-check it's the right backup file.");
          return;
        }
        alert('Restored ' + count + ' field(s). Reloading with your restored data...');
        location.reload();
      } catch (err) {
        alert("Couldn't read that file: " + errText(err));
      }
    });
  }

  const resetBtn = document.getElementById('reset-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', async () => {
      if (!confirm('Reset all data back to your original spreadsheet values? This clears your edits, debt inputs, goal, and net worth entries.')) return;
      state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      state.income = JSON.parse(JSON.stringify(DEFAULT_INCOME));
      state.salary = DEFAULT_SALARY;
      state.debts = {};
      state.goal = JSON.parse(JSON.stringify(DEFAULT_GOAL));
      state.netWorth = JSON.parse(JSON.stringify(DEFAULT_NET_WORTH));
      simState = {};
      persist('budget:items', state.items);
      persist('budget:income', state.income);
      persist('budget:salary', state.salary);
      persist('budget:debts', state.debts);
      persist('budget:goal', state.goal);
      persist('budget:netWorth', state.netWorth);
      render();
    });
  }
}

initAuth();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* no sw.js hosted alongside this file - fine, app still works */ });
  });
}
</script>
</body>
</html>
